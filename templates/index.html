<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>台灣論文寫作 AI 助理</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@100..900&display=swap');
        body {
            font-family: 'Inter', 'Noto Sans TC', sans-serif;
            background-color: #f7f9fc;
        }
        /* 樣式調整，確保輸出區塊可滾動且美觀 */
        #output-container {
            min-height: 400px;
            white-space: pre-wrap;
            word-wrap: break-word;
        }
        /* 載入動畫樣式 */
        .loading-dots div {
            animation: bounce 0.6s infinite alternate;
        }
        .loading-dots div:nth-child(2) {
            animation-delay: 0.2s;
        }
        .loading-dots div:nth-child(3) {
            animation-delay: 0.4s;
        }
        @keyframes bounce {
            from { transform: translateY(0); }
            to { transform: translateY(-8px); }
        }
    </style>
</head>
<body class="p-4 sm:p-8">
    <div class="max-w-4xl mx-auto bg-white shadow-xl rounded-xl p-6 md:p-10 border border-gray-100">
        
        <header class="text-center mb-10">
            <h1 class="text-3xl sm:text-4xl font-extrabold text-gray-800 tracking-tight mb-2">
                台灣論文寫作 AI 助理
            </h1>
            <p class="text-gray-500">
                基於 Gemini API，專為學術論文各章節草稿生成設計 (支援 Grounding 引用來源)。
            </p>
        </header>

        <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
            
            <div class="lg:col-span-1 bg-gray-50 p-6 rounded-lg shadow-inner">
                <h2 class="text-xl font-semibold text-gray-700 mb-4 border-b pb-2">章節與關鍵資訊</h2>

                <div class="mb-6">
                    <label for="chapter-select" class="block text-sm font-medium text-gray-700 mb-2">選擇撰寫章節</label>
                    <select id="chapter-select" class="w-full p-3 border border-gray-300 rounded-lg focus:ring-blue-500 focus:border-blue-500 transition duration-150 ease-in-out bg-white appearance-none">
                        <option value="introduction" selected>緒論 (Introduction)</option>
                        <option value="literature_review">文獻回顧 (Literature Review)</option>
                        <option value="methodology">研究方法 (Methodology)</option>
                        <option value="results">結果與討論 (Results and Discussion)</option>
                        <option value="conclusion">結論與建議 (Conclusion and Suggestions)</option>
                    </select>
                </div>

                <div class="mb-6">
                    <label for="prompt-input" class="block text-sm font-medium text-gray-700 mb-2">輸入關鍵資訊 / 核心論點</label>
                    <textarea id="prompt-input" rows="10" class="w-full p-4 border border-gray-300 rounded-lg focus:ring-blue-500 focus:border-blue-500 transition duration-150 ease-in-out placeholder-gray-400" placeholder="例如：
- 研究主題：生成式 AI 對大學生學習動機的影響
- 核心發現：中度使用 AI 工具能顯著提高作業完成率，但過度依賴會降低深度學習意願。
- 欲探討的理論框架：自我決定理論 (SDT)"></textarea>
                </div>

                <button id="generate-button" class="w-full bg-blue-600 text-white font-bold py-3 rounded-lg hover:bg-blue-700 transition duration-200 shadow-md disabled:bg-blue-400 disabled:cursor-not-allowed flex items-center justify-center">
                    <span id="button-text">開始生成草稿</span>
                    <div id="loading-indicator" class="loading-dots hidden ml-3">
                        <div class="h-2 w-2 bg-white rounded-full inline-block mx-0.5"></div>
                        <div class="h-2 w-2 bg-white rounded-full inline-block mx-0.5"></div>
                        <div class="h-2 w-2 bg-white rounded-full inline-block mx-0.5"></div>
                    </div>
                </button>

                <div id="error-message" class="mt-4 p-3 bg-red-100 text-red-700 border border-red-300 rounded-lg hidden"></div>
            </div>

            <div class="lg:col-span-2">
                <h2 class="text-xl font-semibold text-gray-700 mb-4 border-b pb-2">生成結果</h2>
                
                <div class="p-6 bg-gray-50 rounded-lg border border-gray-200">
                    <pre id="output-container" class="text-gray-800 text-sm leading-relaxed overflow-auto"></pre>
                </div>

                <button id="copy-button" class="mt-4 bg-gray-200 text-gray-700 font-medium py-2 px-4 rounded-lg hover:bg-gray-300 transition duration-200 disabled:opacity-50" disabled>
                    複製內容
                </button>
                <span id="copy-status" class="ml-3 text-sm text-green-600 hidden">已複製!</span>
            </div>
        </div>
    </div>

    <script>
        const API_ENDPOINT = '/api/write-paper'; // 指向您的 Flask 後端路由
        
        // --- D1. 元素選擇器 ---
        const chapterSelect = document.getElementById('chapter-select');
        const promptInput = document.getElementById('prompt-input');
        const generateButton = document.getElementById('generate-button');
        const buttonText = document.getElementById('button-text');
        const loadingIndicator = document.getElementById('loading-indicator');
        const outputContainer = document.getElementById('output-container');
        const errorMessage = document.getElementById('error-message');
        const copyButton = document.getElementById('copy-button');
        const copyStatus = document.getElementById('copy-status');

        // --- D2. 輔助函式 ---

        /**
         * D2-1. 切換 UI 狀態 (生成中 vs. 閒置)
         * @param {boolean} isLoading - 是否正在載入
         */
        function toggleLoading(isLoading) {
            generateButton.disabled = isLoading;
            // 只有在非載入中且輸出有內容時才啟用複製按鈕
            copyButton.disabled = isLoading || outputContainer.textContent.trim() === ''; 
            if (isLoading) {
                buttonText.textContent = 'AI 正在思考...';
                loadingIndicator.classList.remove('hidden');
                errorMessage.classList.add('hidden');
                outputContainer.textContent = ''; // 清空舊內容
                copyStatus.classList.add('hidden');
            } else {
                buttonText.textContent = '開始生成草稿';
                loadingIndicator.classList.add('hidden');
            }
        }

        /**
         * D2-2. 顯示錯誤訊息
         * @param {string} message - 錯誤訊息內容
         */
        function displayError(message) {
            errorMessage.textContent = `錯誤: ${message}`;
            errorMessage.classList.remove('hidden');
        }

        // --- D3. 事件監聽器 (Listener) ---
        
        // D3-1. 生成按鈕點擊事件
        generateButton.addEventListener('click', async () => {
            const chapter = chapterSelect.value;
            const promptText = promptInput.value.trim();

            if (!promptText) {
                displayError("請輸入關鍵資訊/核心論點！");
                return;
            }

            toggleLoading(true);

            try {
                // 發送 POST 請求到後端 API
                const response = await fetch(API_ENDPOINT, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        chapter: chapter,
                        prompt_text: promptText
                    })
                });

                const result = await response.json();

                if (!response.ok) {
                    // 處理 HTTP 錯誤 (例如 400, 500)
                    const errorMsg = result.error || '後端服務發生未知錯誤。';
                    displayError(errorMsg);
                    return;
                }

                if (result.error) {
                    // 處理 API 呼叫錯誤 (例如 Key 缺失)
                    displayError(result.error);
                } else {
                    // 成功：顯示生成的文本
                    outputContainer.textContent = result.generated_text;
                    errorMessage.classList.add('hidden');
                }

            } catch (error) {
                // 處理網路連線錯誤
                console.error('Fetch error:', error);
                displayError(`網路連線失敗或後端未啟動: ${error.message}`);
            } finally {
                toggleLoading(false);
            }
        });

        // D3-2. 複製按鈕點擊事件
        copyButton.addEventListener('click', () => {
            const content = outputContainer.textContent;
            if (content) {
                // 使用 document.execCommand('copy') 來確保在 iFrame 環境下能正常運作
                const tempTextArea = document.createElement('textarea');
                tempTextArea.value = content;
                document.body.appendChild(tempTextArea);
                tempTextArea.select();
                try {
                    document.execCommand('copy');
                    copyStatus.classList.remove('hidden');
                    // 2 秒後隱藏 "已複製" 提示
                    setTimeout(() => copyStatus.classList.add('hidden'), 2000); 
                } catch (err) {
                    console.error('無法複製內容', err);
                    // 這裡不使用 alert，而是提供一個無法複製的提示
                    displayError('無法自動複製內容，請手動選取複製。');
                }
                document.body.removeChild(tempTextArea);
            }
        });

        // --- D4. 初始設定 ---
        window.onload = () => {
            toggleLoading(false); // 確保一開始按鈕是啟用的
        };
    </script>
</body>
</html>
